name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The XrmToolBox project needs a local XrmToolBox install, so CI builds only the app and tests.
      - name: Build
        run: |
          dotnet build src/CRMManager.App/CRMManager.App.csproj --configuration Release
          dotnet build tests/CRMManager.Tests/CRMManager.Tests.csproj --configuration Release

      - name: Test
        run: dotnet test tests/CRMManager.Tests/CRMManager.Tests.csproj --configuration Release --no-build

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $name = "CRMManager-${{ github.ref_name }}.zip"
          Compress-Archive -Path src/CRMManager.App/bin/Release/net48/* -DestinationPath $name

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CRMManager-${{ github.ref_name }}.zip
          generate_release_notes: true
